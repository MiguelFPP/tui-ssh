# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tui-ssh

builds:
  - id: tui-ssh
    main: ./cmd/tui-ssh
    binary: tui-ssh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tui-ssh
    ids:
      - tui-ssh
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci:"
      - "^style:"
      - "merge conflict"
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: MiguelFPP
    name: tui-ssh
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
